[package]
name = "auohp-api"
version = "0.0.0"
edition = "2024"
default-run = "auohp-api"
license = "AGPL-3.0-or-later"
authors = ["ACT UP New York <info@actupny.com>"]
publish = false

[features]
default = []
# Forwarded to auohp-core, which selects the whisper-rs and ort backends.
# Enable one at build time: metal (macOS dev) or cuda (production).
metal = ["auohp-core/metal"]
cuda = ["auohp-core/cuda"]

[dependencies]
auohp-core = { workspace = true }

tokio = { version = "1", features = ["full"] }
tokio-retry = "0.3"

axum = "0.8"
tower = { version = "0.5.3" }
tower-http = { version = "0.7", features = ["trace", "cors"] }
http = "1.5"

async-graphql = { version = "8.0.0-rc.5", features = ["graphiql", "chrono"] }
async-graphql-axum = "8.0.0-rc.5"

anyhow = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

dotenvy = "0.15"

# TODO: Pin back to a version tag when https://github.com/neo4j-labs/neo4rs/pull/298 lands.
neo4rs = { version = "0.9.0-rc.10" }

serde = { version = "1", features = ["derive", "alloc"] }
serde_json = "1"

chrono = "0.4"

nanoid = "0.5"

rustls = { version = "0.23", features = ["aws-lc-rs"] }
rand = "0.10"
asserting = "0.17.0"
