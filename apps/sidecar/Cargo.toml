[package]
name = "auohp-sidecar"
version = "0.0.0"
edition = "2024"
default-run = "auohp-sidecar"
license = "AGPL-3.0-or-later"
authors = ["ACT UP New York <info@actupny.com>"]
publish = false

[features]
default = []
# GPU acceleration: enable one at build time. Both forward to auohp-core, which
# owns backend selection (see packages/core/Cargo.toml).
metal = ["auohp-core/metal"]
cuda = ["auohp-core/cuda"]

[build-dependencies]
thiserror = "2"
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
anyhow-tauri = "1.0.1"
axum = "0.8"
auohp-core = { workspace = true }
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json"] }
tokio-util = "0.7"

tokio-stream = { version = "0.1", features = ["sync"] }

thiserror = "2"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

sysinfo = "0.38"
machine-info = "1"

nanoid = "0.5"

tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-single-instance = "2"
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["trace", "cors"] }
http = "1.4.0"
tauri-plugin-positioner = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-liquid-glass = "0.1.6"
tauri-macros = "2.6.3"
