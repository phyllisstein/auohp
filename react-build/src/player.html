<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>

<body>
    <div id="player-component"></div>
    <div id="search-component"></div>
    <script type="module">
        import { renderPlayer, renderSearch } from "./index.tsx";
        import queryString from "query-string";
        const queryParams = queryString.parse(window.location.search);
        renderPlayer(Number(queryParams.interview), document.getElementById("player-component"));
        renderSearch(document.getElementById("search-component"));
    </script>
</body>

</html>
