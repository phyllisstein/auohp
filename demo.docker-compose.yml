services:
  app:
    build:
      context: .
    secrets:
      - source: environment
        mode: 0440
    depends_on: [neo4j]
    environment:
      NEO4J_URI: 'bolt://neo4j:7687'
      NEO4J_USER: 'neo4j'
      NEO4J_PASSWORD: 'auohpauohp'
    expose:
      - '3030'
      - '4040'
    ports:
      - '3030:3030'
      - '4040:4040'
    network_mode: host
    volumes:
      - type: bind
        source: .
        target: /app
      - type: volume
        source: node_modules
        target: /app/node_modules
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/auohpauohp
      NEO4J_PLUGINS: '["apoc", "genai"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*, genai.*
      NEO4J_server_default__listen__address: '0.0.0.0'
      NEO4J_server_jvm_additional: -Dapoc.ttl.enabled=true
    expose:
      - '7474'
      - '7687'
    ports:
      - '7474:7474'
      - '7687:7687'
    network_mode: host
    volumes:
      - type: bind
        source: /var/lib/neo4j/data
        target: /data
  nginx:
    build:
      context: ./scripts/nginx
    ports:
      - '80:80'
      - '443:443'
    network_mode: host
volumes:
  node_modules:
secrets:
  environment:
    file: .env
