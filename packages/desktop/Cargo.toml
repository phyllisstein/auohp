[package]
name = "auohp-desktop"
version = "0.0.0"
edition = "2024"
default-run = "auohp-desktop"
license = "GPL-3.0-or-later"
authors = ["ACT UP New York <contact@auohp.org>"]

[dependencies]
anyhow = "1"
axum = "0.8"
auohp-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json"] }

# Structured logging --- tracing instruments async code; tracing-subscriber
# formats and emits those events (to stdout, to files, etc.)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }


[build-dependencies]
# Error handling --- thiserror generates Error impls for your own types;
# anyhow provides a flexible Result<T, anyhow::Error> for application code.
thiserror = "2"
tauri-build = "2"
