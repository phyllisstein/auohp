[package]
name = "auohp-api"
version = "0.0.0"
edition = "2024"
default-run = "auohp-api"
license = "GPL-3.0-or-later"
authors = ["ACT UP New York <contact@auohp.org>"]

[features]
default = []
# GPU acceleration --- enable at build time, not both at once.
#   cargo build --features metal    (macOS dev, Apple Silicon GPU)
#   cargo build --features cuda     (production, NVIDIA GPU)
#
# candle-core/metal enables Metal GPU compute for tensor operations.
# candle-*/accelerate enables Apple's Accelerate framework (vecLib BLAS)
# for fast CPU matrix multiply --- used as a fallback when an op doesn't
# have a Metal kernel, and for the mel spectrogram FFT.
metal = [
    "candle-core/metal", "candle-nn/metal",
    "candle-core/accelerate", "candle-nn/accelerate", "candle-transformers/accelerate",
    "ort/coreml",
]
cuda = [
    "candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda",
    "ort/cuda",
]

[dependencies]
# Async runtime --- tokio is the standard async executor for Rust.
# features = ["full"] enables all tokio sub-crates (net, fs, time, sync, etc.)
# so we don't have to add individual features as they're needed.
tokio = { version = "1", features = ["full"] }
tokio-retry = "0.3"

# HTTP framework --- axum is built on top of Tower middleware by the Tokio team.
# It uses type-safe extractors and composes well with the rest of this stack.
axum = "0.8"

# GraphQL --- async-graphql is code-driven: you define Rust types and derive the
# schema from them via macros. async-graphql-axum bridges the two frameworks.
async-graphql = { version = "7", features = ["tracing", "graphiql", "chrono"] }
async-graphql-axum = "7"

# Error handling --- thiserror generates Error impls for your own types;
# anyhow provides a flexible Result<T, anyhow::Error> for application code.
anyhow = "1"
thiserror = "2"

# Structured logging --- tracing instruments async code; tracing-subscriber
# formats and emits those events (to stdout, to files, etc.)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Environment --- dotenvy loads .env files into std::env; successor to dotenv.
dotenvy = "0.15"

# Neo4j --- neo4rs is the async Bolt client for Neo4j. It manages a connection
# pool internally, so one Graph handle is shared across the whole server.
neo4rs = "0.9.0-rc.9"

# Serialization --- serde is the standard Rust serialization framework.
# serde_json is used to encode per-word timing data as a JSON string property
# on Statement nodes in Neo4j.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Date handling --- chrono is already a transitive dependency (neo4rs uses it
# internally to deserialize Bolt Date values). Adding it as a direct dep
# just makes it importable in our code. No new code is compiled.
chrono = "0.4"

# ID generation --- nanoid produces short, URL-safe, unique identifiers.
# Used for node UIDs in Neo4j, matching the existing TypeScript seeder.
nanoid = "0.4"

# Transcription --- candle runs Whisper entirely in Rust (no C++ dependency).
# candle-core is the tensor library, candle-nn provides neural-network layers,
# and candle-transformers contains the Whisper encoder/decoder model definition
# plus the mel-spectrogram FFT.  Models are downloaded from HuggingFace Hub
# via hf-hub and loaded from safetensors format.
#
# pyannote-rs runs ONNX-exported pyannote models for speaker diarization.
# symphonia decodes audio from MP4/WAV/etc. containers.
# rubato resamples to 16 kHz mono as required by Whisper.
candle-core = "0.10.1"
candle-nn = "0.10.1"
candle-transformers = "0.10.1"
hf-hub = "0.5"
tokenizers = { version = "0.22", default-features = false }
rand = "0.9"
pyannote-rs = "0.3"
# Pin ort to rc.10 --- pyannote-rs 0.3.4 depends on this exact version and
# the ndarray TensorArrayData trait changed in rc.11, breaking compilation.
ort = "=2.0.0-rc.10"
symphonia = { version = "0.5", features = ["isomp4", "aac", "wav", "pcm"] }
rubato = "1"
audioadapter-buffers = "2"

# On-device sentence embeddings --- fastembed wraps ONNX sentence transformers
# (BAAI/bge-small-en-v1.5, 384-dim). Pinned to ~5.8 (allows 5.8.x patches
# but not 5.9+) because fastembed 5.9 bumps ort to rc.11, which breaks
# pyannote-rs --- its ndarray TensorArrayData trait changed between rc.10
# and rc.11. The `ort = "=2.0.0-rc.10"` pin above enforces the same
# constraint from the other direction; this keeps them in sync.
fastembed = { version = "~5.8", default-features = false, features = ["ort-download-binaries", "hf-hub-native-tls"] }
kodama = "0.3.0"
clap = { version = "4.6.1", features = ["derive"] }

# Speech enhancement --- DeepFilterNet3 neural noise suppression. The inference
# API (DfTract, DfParams) was never published to crates.io (latest is 0.2.5,
# DSP utils only), so we pin to a known commit on main. The "default-model"
# feature embeds DFN3 weights via include_bytes!, so no separate download.
# DeepFilterNet uses tract (not ort) --- two ONNX runtimes coexist in the
# binary with no version conflict between them.
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "d375b2d", default-features = false, features = ["tract", "default-model"] }

# ndarray 0.15 --- required by deep_filter. Also pin tract-* to =0.21.6, the
# last 0.21.x release that uses ndarray 0.15 (0.21.7 bumped to 0.16, which
# breaks compilation against deep_filter's own ndarray imports).
ndarray = "0.15"
tract-core = "=0.21.4"
tract-onnx = "=0.21.4"
tract-hir = "=0.21.4"
tract-pulse = "=0.21.4"
