[package]
name = "auohp-core"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["ACT UP New York <contact@auohp.org>"]

[features]
default = []
# GPU acceleration --- enable at build time, not both at once.
#   cargo build --features metal    (macOS dev, Apple Silicon GPU)
#   cargo build --features cuda     (production, NVIDIA GPU)
metal = [
    "ort/coreml",
    "whisper-rs/metal",
    "fastembed/metal",
]
cuda = [
    "ort/cuda",
    "whisper-rs/cuda",
    "fastembed/cuda",
]

[dependencies]
# Error handling --- thiserror generates Error impls for your own types;
# anyhow provides a flexible Result<T, anyhow::Error> for application code.
anyhow = "1"
thiserror = "2"

# Transcription --- whisper-rs wraps whisper.cpp (C++ FFI) for Whisper ASR.
# Models are pre-downloaded by scripts/download-models.sh into $MODELS_DIR.
# symphonia decodes audio from MP4/WAV/etc. containers.
# rubato resamples to 16 kHz mono as required by Whisper.
#
# ort is not used directly but must be a direct dependency so that the
# `metal` / `cuda` feature gates below can activate `ort/coreml` and
# `ort/cuda` on the shared crate instance that fastembed also pulls in.
# Pinned to rc.10 because fastembed ~5.8 requires it.
ort = "=2.0.0-rc.10"
symphonia = { version = "0.5", features = ["isomp4", "aac", "wav", "pcm"] }
rubato = "1"
audioadapter-buffers = "2"

# On-device sentence embeddings --- fastembed wraps ONNX sentence transformers
# (BAAI/bge-small-en-v1.5, 384-dim). Pinned to ~5.8 (allows 5.8.x patches
# but not 5.9+) because fastembed 5.9 bumps ort to rc.11, which breaks
# pyannote-rs --- its ndarray TensorArrayData trait changed between rc.10
# and rc.11. The `ort = "=2.0.0-rc.10"` pin above enforces the same
# constraint from the other direction; this keeps them in sync.
fastembed = { version = "~5.8", default-features = false, features = ["ort-download-binaries", "hf-hub-native-tls"] }
kodama = "0.3.0"

# Structured logging --- tracing instruments async code; tracing-subscriber
# formats and emits those events (to stdout, to files, etc.)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization --- serde is the standard Rust serialization framework.
# serde_json is used to encode per-word timing data as a JSON string property
# on Statement nodes in Neo4j.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

clap = { version = "4.6.1", features = ["derive"] }

# Async runtime --- tokio is the standard async executor for Rust.
# features = ["full"] enables all tokio sub-crates (net, fs, time, sync, etc.)
# so we don't have to add individual features as they're needed.
tokio = { version = "1", features = ["full"] }
whisper-rs = "0.16.0"
