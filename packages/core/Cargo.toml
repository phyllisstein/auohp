[package]
name = "auohp-core"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["ACT UP New York <info@actupny.com>"]

[features]
default = []
# GPU acceleration; enable one at build time.
metal = ["ort/coreml", "whisper-rs/metal"]
cuda = ["ort/cuda", "whisper-rs/cuda"]

[dependencies]
anyhow = "1"
thiserror = "2"

# Direct dependency only so the `metal`/`cuda` features reach the `ort`
# instance fastembed shares; keep the version compatible with fastembed's.
ort = "2.0.0-rc.13"
symphonia = { version = "0.5", features = ["isomp4", "aac", "wav", "pcm"] }
rubato = "1"
audioadapter-buffers = "2"

knf-rs = "0.3"
kodama = "0.3"
petgraph = "0.6"
simsimd = "6.5"

# Do not add candle-core: it switches on fastembed's optional candle backend,
# whose PTX build fails on pre-Ampere CUDA hardware.
fastembed = { version = "6" }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

clap = { version = "4.6.1", features = ["derive"] }

tokio = { version = "1", features = ["full"] }
whisper-rs = "0.16.0"

chrono = { version = "0.4", features = ["serde"] }

unicode-segmentation = "1"

cruet = "1"
