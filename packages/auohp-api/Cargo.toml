[package]
name = "auohp-api"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime — tokio is the standard async executor for Rust.
# features = ["full"] enables all tokio sub-crates (net, fs, time, sync, etc.)
# so we don't have to add individual features as they're needed.
tokio = { version = "1", features = ["full"] }

# HTTP framework — axum is built on top of Tower middleware by the Tokio team.
# It uses type-safe extractors and composes well with the rest of this stack.
axum = "0.8"

# GraphQL — async-graphql is code-driven: you define Rust types and derive the
# schema from them via macros. async-graphql-axum bridges the two frameworks.
async-graphql = { version = "7", features = ["tracing", "graphiql"] }
async-graphql-axum = "7"

# Error handling — thiserror generates Error impls for your own types;
# anyhow provides a flexible Result<T, anyhow::Error> for application code.
anyhow = "1"
thiserror = "2"

# Structured logging — tracing instruments async code; tracing-subscriber
# formats and emits those events (to stdout, to files, etc.)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Environment — dotenvy loads .env files into std::env; successor to dotenv.
dotenvy = "0.15"

# Neo4j — neo4rs is the async Bolt client for Neo4j. It manages a connection
# pool internally, so one Graph handle is shared across the whole server.
neo4rs = "0.8"

# Serialization — serde is the standard Rust serialization framework.
# serde_json is used to encode per-word timing data as a JSON string property
# on Statement nodes in Neo4j.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ID generation — nanoid produces short, URL-safe, unique identifiers.
# Used for node UIDs in Neo4j, matching the existing TypeScript seeder.
nanoid = "0.4"

# Transcription — whisper-rs wraps whisper.cpp for ASR with DTW word-level
# timestamps. pyannote-rs runs ONNX-exported pyannote models for speaker
# diarization. symphonia decodes audio from MP4/WAV/etc. containers.
# rubato resamples to 16kHz mono as required by whisper.cpp.
whisper-rs = "0.15"
pyannote-rs = "0.3"
# Pin ort to rc.10 — pyannote-rs 0.3.4 depends on this exact version and
# the ndarray TensorArrayData trait changed in rc.11, breaking compilation.
ort = "=2.0.0-rc.10"
symphonia = { version = "0.5", features = ["isomp4", "aac", "wav", "pcm"] }
rubato = "1"
audioadapter-buffers = "2"

# On-device sentence embeddings — fastembed wraps ONNX sentence transformers
# (BAAI/bge-small-en-v1.5, 384-dim). Pinned to ~5.8 (allows 5.8.x patches
# but not 5.9+) because fastembed 5.9 bumps ort to rc.11, which breaks
# pyannote-rs — its ndarray TensorArrayData trait changed between rc.10
# and rc.11. The `ort = "=2.0.0-rc.10"` pin above enforces the same
# constraint from the other direction; this keeps them in sync.
fastembed = { version = "~5.8", default-features = false, features = ["ort-download-binaries", "hf-hub-native-tls"] }
