services:
  app:
    networks:
      - default
      - nginx-proxy
    build:
      context: .
    secrets:
      - source: environment
        mode: 0440
    environment:
      HTTPS_METHOD: noredirect
      VIRTUAL_HOST_MULTIPORTS: |-
        editor.auohp.here:
          '/':
            port: '3030'
        search.auohp.here:
          '/':
            port: '4040'
    depends_on: [neo4j]
    expose:
      - '3030'
      - '4040'
    volumes:
      - type: bind
        source: .
        target: /app
      - type: volume
        source: node_modules
        target: /app/node_modules
  neo4j:
    networks:
        - default
        - nginx-proxy
    image: neo4j:5.20
    environment:
      NEO4J_AUTH: neo4j/auohpauohp
      NEO4J_PLUGINS: '["apoc", "genai"]'
      NEO4J_server_default__listen__address: '0.0.0.0'
      NEO4J_server_jvm_additional: -Dapoc.ttl.enabled=true
      NEO4J_dbms_security_procedures_unrestricted: apoc.*, genai.*
      NEO4J_dbms_memory_heap_initial__size: 2G
      NEO4J_dbms_memory_heap_max__size: 4G
      NEO4J_dbms_memory_pagecache_size: 2G
      VIRTUAL_HOST_MULTIPORTS: |-
        bolt.auohp.here:
          '/':
            port: '7687'
        neo4j.auohp.here:
          '/':
            port: '7474'
    ports:
      - '7474:7474'
      - '7687:7687'
    expose:
      - '7474'
      - '7687'
    volumes:
      - type: volume
        source: graph_data
        target: /data

volumes:
  graph_data:
  node_modules:

secrets:
  environment:
    file: .env

networks:
  default:
  nginx-proxy:
    external: true
    name: nginx-proxy
