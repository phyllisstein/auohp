services:
  app:
    networks:
      - default
      - nginx-proxy
    build:
      context: .
    secrets:
      - source: environment
        mode: 0440
    environment:
      RUST_LOG: auohp_api=debug,transcribe=debug
      RUSTFLAGS: -Ctarget-feature=+fp16
      VIRTUAL_HOST_MULTIPORTS: |-
        editor.auohp.localhost:
          "/":
            port: "3030"
        search.auohp.localhost:
          "/":
            port: "4040"
        api.auohp.localhost:
          "/":
            port: "6060"
    # depends_on: [neo4j]
    expose:
      - "3030"
      - "4040"
      - "6060"
    ports:
      - "6060:6060"
    volumes:
      - type: bind
        source: .
        target: /app
      - type: volume
        source: node_modules
        target: /app/node_modules
      - type: volume
        source: rust_target
        target: /app/target
      - type: volume
        source: auohp_models
        target: /models
      - type: volume
        source: cargo_registry
        target: /usr/local/cargo/registry

  neo4j:
    networks:
      - default
      - nginx-proxy
    image: neo4j:2026.04.0
    environment:
      NEO4J_AUTH: neo4j/auohpauohp
      NEO4J_PLUGINS: '["apoc", "genai"]'
      NEO4J_server_default__listen__address: "0.0.0.0"
      NEO4J_server_jvm_additional: -Dapoc.ttl.enabled=true --add-modules=jdk.incubator.vector
      NEO4J_dbms_security_auth__minimum__password__length: "1"
      NEO4J_dbms_security_procedures_unrestricted: apoc.*, genai.*
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
      HTTPS_METHOD: noredirect
      VIRTUAL_HOST_MULTIPORTS: |-
        bolt.auohp.localhost:
          "/":
            port: "7687"
        neo4j.auohp.localhost:
          "/":
            port: "7474"
    ports:
      - "7474:7474"
      - "7687:7687"
    expose:
      - "7474"
      - "7687"
    volumes:
      - type: volume
        source: graph_data
        target: /data

volumes:
  auohp_models:
  cargo_registry:
  graph_data:
  node_modules:
  rust_target:

secrets:
  environment:
    file: .env

networks:
  default:
  nginx-proxy:
    external: true
    name: nginx-proxy
