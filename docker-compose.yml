services:
  app:
    networks:
      - default
      - nginx-proxy
    build:
      context: .
    secrets:
      - source: environment
        mode: 0440
    environment:
      HTTPS_METHOD: noredirect
      VIRTUAL_HOST_MULTIPORTS: |-
        editor.auohp.here:
          "/":
            port: "3030"
        search.auohp.here:
          "/":
            port: "4040"
    depends_on: [neo4j]
    expose:
      - "3030"
      - "4040"
    volumes:
      - type: bind
        source: .
        target: /app
      - type: volume
        source: node_modules
        target: /app/node_modules
  auohp-api:
    networks:
      - default
      - nginx-proxy
    build:
      context: .
      dockerfile: packages/auohp-api/Dockerfile
    secrets:
      - source: environment
        mode: 0440
    environment:
      VIRTUAL_HOST_MULTIPORTS: |-
        api.auohp.here:
          "/":
            port: "6060"
    depends_on: [neo4j]
    expose:
      - "6060"
    volumes:
      # ONNX model weights (BGE-small, pyannote segmentation, wespeaker).
      # Downloaded from Hugging Face Hub on first startup; reused thereafter.
      - type: volume
        source: auohp_models
        target: /models

  neo4j:
    networks:
      - default
      - nginx-proxy
    image: neo4j:2026-enterprise
    environment:
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_AUTH: neo4j/auohpauohp
      NEO4J_PLUGINS: '["apoc", "genai"]'
      NEO4J_server_default__listen__address: "0.0.0.0"
      NEO4J_server_jvm_additional: -Dapoc.ttl.enabled=true --add-modules=jdk.incubator.vector
      NEO4J_dbms_security_auth__minimum__password__length: "1"
      NEO4J_dbms_security_procedures_unrestricted: apoc.*, genai.*
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
      HTTPS_METHOD: noredirect
      VIRTUAL_HOST_MULTIPORTS: |-
        bolt.auohp.here:
          "/":
            port: "7687"
        neo4j.auohp.here:
          "/":
            port: "7474"
    ports:
      - "7474:7474"
      - "7687:7687"
    expose:
      - "7474"
      - "7687"
    volumes:
      - type: volume
        source: graph_data
        target: /data

volumes:
  graph_data:
  node_modules:
  auohp_models:

secrets:
  environment:
    file: .env

networks:
  default:
  nginx-proxy:
    external: true
    name: nginx-proxy
