services:
  app:
    networks:
      - default
      - nginx-proxy
    build:
      context: .
    secrets:
      - source: environment
        mode: 0440
    environment:
      RUST_LOG: auohp_api=debug,transcribe=debug
      RUSTFLAGS: "-Ctarget-feature=+fp16 -Awarnings"
      HTTPS_METHOD: noredirect
      VIRTUAL_HOST_MULTIPORTS: |-
        editor.auohp.localhost:
          "/":
            port: "3030"
        search.auohp.localhost:
          "/":
            port: "4040"
        api.auohp.localhost:
          "/":
            port: "6060"
    depends_on: [neo4j]
    extra_hosts:
      - "api.auohp.localhost:host-gateway"
      - "editor.auohp.localhost:host-gateway"
      - "search.auohp.localhost:host-gateway"
    expose:
      - "3030"
      - "4040"
      - "6060"
    volumes:
      # FIXME: this bind mount is the root of an exception cascade. Because the
      # source tree lives on the host and every tool runs in the container, we
      # pay virtiofs for all of it, and each consequence has needed its own
      # workaround: `CARGO_TARGET_DIR=/target` (volumes nested under a virtiofs
      # bind are torn down ~1s after start), `enableGlobalCache: false` (Yarn's
      # pnpm linker hardlinks, and hardlinks can't cross the fuseblk/overlayfs
      # boundary --- EXDEV), `target` and six `packages/*/node_modules` entries
      # in `.watchmanconfig` plus four `wholename` guards (inotify-over-virtiofs
      # floods and recrawls; vendored files trip triggers), and ~200 lines of
      # process-group supervision in `scripts/develop.sh`.
      #
      # The accounting is upside down: all of that manages one sentence of
      # actual behaviour --- edit a file, the right dev server picks it up.
      # Worse, the `editor-restart` and `search-restart` triggers cold-start
      # Vite to accomplish what Vite already does natively on `.env`,
      # `tsconfig.json`, and `vite.config.ts` changes, losing HMR state to do
      # it. Those two are the first things to delete.
      #
      # The fix is not more mount topology (inverting the nesting so no volume
      # sits under a bind is exception #10, not a solution). It is to revisit
      # the premise: either run the JS toolchain on the host natively, or move
      # the source *into* the container on a named volume. Both delete virtiofs
      # rather than route around it. Deferred deliberately --- `nodeLinker: pnp`
      # is the other escape, previously declined on tooling-compat grounds.
      - type: bind
        source: .
        target: /app
      # No longer load-bearing: this volume is destroyed ~1s after start (it is
      # nested under the bind above), so installs land on the host tree either
      # way. Kept only so the topology is visible at the point of the FIXME.
      - type: volume
        source: node_modules
        target: /app/node_modules
      - type: volume
        source: rust_target
        target: /target
      - type: volume
        source: auohp_models
        target: /models
      - type: volume
        source: cargo_registry
        target: /usr/local/cargo/registry

  neo4j:
    networks:
      - default
      - nginx-proxy
    image: neo4j:latest
    environment:
      NEO4J_AUTH: neo4j/auohpauohp
      NEO4J_PLUGINS: '["apoc", "genai"]'
      NEO4J_server_default__listen__address: "0.0.0.0"
      NEO4J_server_jvm_additional: -Dapoc.ttl.enabled=true --add-modules=jdk.incubator.vector
      NEO4J_dbms_security_auth__minimum__password__length: "1"
      NEO4J_dbms_security_procedures_unrestricted: apoc.*, genai.*
      NEO4J_server_memory_heap_initial__size: 4G
      NEO4J_server_memory_heap_max__size: 4G
      NEO4J_server_memory_pagecache_size: 1G
      HTTPS_METHOD: noredirect
      VIRTUAL_HOST_MULTIPORTS: |-
        bolt.auohp.localhost:
          "/":
            port: "7687"
        neo4j.auohp.localhost:
          "/":
            port: "7474"
    ports:
      - "7474:7474"
      - "7687:7687"
    expose:
      - "7474"
      - "7687"
    volumes:
      - type: volume
        source: graph_data
        target: /data

volumes:
  auohp_models:
  cargo_registry:
  graph_data:
  node_modules:
  rust_target:

secrets:
  environment:
    file: .env

networks:
  default:
  nginx-proxy:
    external: true
    name: nginx-proxy
